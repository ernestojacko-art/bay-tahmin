name: Extract Bay Tahmin Backend Fixed

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, '[backend-extract]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract fixed backend ZIP without modifying its contents
        shell: bash
        run: |
          set -euo pipefail
          test -f bay-tahmin-backend-fixes.zip
          rm -rf /tmp/bay-extract
          mkdir -p /tmp/bay-extract
          unzip -q bay-tahmin-backend-fixes.zip -d /tmp/bay-extract
          top_count=$(find /tmp/bay-extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          file_count=$(find /tmp/bay-extract -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$top_count" -eq 1 ] && [ "$file_count" -eq 0 ]; then
            src=$(find /tmp/bay-extract -mindepth 1 -maxdepth 1 -type d | head -n1)
          else
            src=/tmp/bay-extract
          fi
          cp -a "$src"/. .
          rm -f bay-tahmin-backend-fixes.zip
      - name: Remove temporary workflow and commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/extract-bay-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply bay tahmin backend fixed [backend-extract]"
          git push origin HEAD:main
