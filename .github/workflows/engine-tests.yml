name: Bay Tahmin Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run prediction consistency tests
        working-directory: backend
        run: python -m pytest -q test_prediction_consistency.py
